name: TV App Customizations
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply-tv-app-customizations.py'
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply TV app customization patch
        run: |
          python3 scripts/apply-tv-app-customizations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/app/src/main/java/com/gathin/tvhome/AppAdapter.java launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java
          git commit -m "feat: customize app tiles from remote" || echo "No source changes to commit"
          git push
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: launcher
        run: bash gradlew :app:assembleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-customized-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
