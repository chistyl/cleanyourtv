name: TV App Customizations
# Rebuild the customized TV launcher and publish both the APK and full source archive.
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/app/src/main/java/com/gathin/tvhome/**'
      - 'launcher/app/src/main/AndroidManifest.xml'
      - 'launcher/app/build.gradle'
      - 'launcher/app/src/main/res/values/config.xml'
      - 'launcher/app/src/main/res/**'
      - '.github/workflows/tv-app-customizations.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: launcher
        run: bash gradlew :app:assembleRelease --no-daemon
      - name: Package complete source ZIP
        run: |
          zip -r CleanYourTV-source.zip . \
            -x '.git/*' '*/.git/*' '.gradle/*' '*/.gradle/*' \
               '*/build/*' '*/.idea/*' '*.iml'
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-customized-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-complete-source
          path: CleanYourTV-source.zip
          if-no-files-found: error
          retention-days: 14
